<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>نُطق — رحلتك في تعلّم أي لغة</title>
<style>
  :root{
    --bg:#0c0f14; --bg-elev:#171c24; --bg-elev-2:#1e2530;
    --text:#F1ECE0; --text-muted:#8C93A3;
    --amber:#D4AF37; --amber-dim:#3d341a;
    --teal:#2E8B7B; --teal-dim:#12312c;
    --coral:#B5233E; --coral-dim:#331018;
    --violet:#6E5A9E; --violet-dim:#221d38;
    --border:rgba(212,175,55,0.14); --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;color:var(--text);
    font-family:'Segoe UI','Tahoma','Noto Sans Arabic','Noto Sans',sans-serif;min-height:100%;}
  body{padding:24px 16px 60px;
    background:
      radial-gradient(circle at 12% 15%, rgba(212,175,55,0.10), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(46,139,123,0.13), transparent 45%),
      radial-gradient(circle at 85% 88%, rgba(181,35,62,0.14), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(110,90,158,0.12), transparent 45%),
      var(--bg);
    background-attachment:fixed;}
  .wrap{max-width:760px;margin:0 auto;}
  a{color:var(--amber);}
  .btn{border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .08s ease,opacity .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--amber);color:#1a1206;}
  .btn-secondary{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);}
  .btn-teal{background:var(--teal);color:#06211d;}
  .btn-block{width:100%;}
  .card{background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 40%), var(--bg-elev);
    border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);}
  .gem-icon{display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));}
  .shell-icon{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));animation:shellBob 4.5s ease-in-out infinite;}
  @keyframes shellBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-5deg);}}
  .modal-overlay{position:fixed;inset:0;background:rgba(4,5,7,.72);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;backdrop-filter:blur(2px);}
  .muted{color:var(--text-muted);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  select,textarea,input[type=text]{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);
    padding:11px 12px;border-radius:10px;font-size:14px;font-family:inherit;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--amber);animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:14px;padding:16px 0;}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:10px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--amber),var(--coral));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#1a1206;flex-shrink:0;}
  .brand h1{font-size:20px;margin:0;font-weight:800;}
  .brand p{margin:1px 0 0;color:var(--text-muted);font-size:12.5px;}
  .navbtns{display:flex;gap:8px;}
  .navbtn{background:var(--bg-elev);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:9px;font-size:12.5px;cursor:pointer;}
  .navbtn:hover{border-color:var(--amber);}

  /* Hero journey */
  .journey{position:relative;padding:26px 6px 10px;overflow:hidden;}
  .journey-line{position:relative;display:flex;justify-content:space-between;align-items:center;margin:18px 0 22px;}
  .journey-line:before{content:'';position:absolute;top:50%;right:0;left:0;height:2px;background:var(--border);z-index:0;}
  .lvl-node{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;background:var(--bg-elev-2);
    border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--text-muted);}
  .lvl-node.reached{border-color:var(--teal);color:var(--teal);background:var(--teal-dim);}
  .scatter{position:relative;height:74px;margin-bottom:6px;}
  .scatter .sc-item{position:absolute;opacity:.9;}
  .greet-btn{background:none;border:1px solid var(--border);color:var(--amber);border-radius:20px;padding:6px 16px;
    font-size:12.5px;cursor:pointer;display:block;margin:10px auto 0;font-family:inherit;}
  .greet-btn:hover{border-color:var(--amber);}

  /* Language grid */
  .lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .lang-chip{background:radial-gradient(circle at 50% 0%, rgba(212,175,55,.06), transparent 60%), var(--bg-elev-2);
    border:1px solid var(--border);border-radius:12px;padding:16px 8px;
    text-align:center;cursor:pointer;font-size:13px;font-weight:700;transition:border-color .15s ease, transform .1s ease;}
  .lang-chip:hover{border-color:var(--amber);transform:translateY(-2px);}
  .lang-chip .ic{display:flex;justify-content:center;margin-bottom:8px;}

  /* Dashboard path */
  .week-path{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .lesson-dot{width:54px;height:54px;border-radius:12px;background:var(--bg-elev-2);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;}
  .lesson-dot.done{background:var(--teal-dim);border-color:var(--teal);}
  .lesson-dot.locked{opacity:.4;cursor:not-allowed;}
  .lesson-dot .lbl{font-size:8px;color:var(--text-muted);margin-top:2px;}

  /* Persona bubbles */
  .persona{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
  .persona.right{flex-direction:row-reverse;}
  .avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .avatar.fares{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);}
  .avatar.lama{background:var(--violet-dim);color:var(--violet);border:1px solid var(--violet);}
  .bubble{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:12px;padding:9px 13px;font-size:13.5px;max-width:80%;line-height:1.6;}

  /* Lesson */
  .context-line{color:var(--text-muted);font-style:normal;font-size:13.5px;text-align:center;margin:8px 0 14px;padding:8px 12px;
    border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);}
  .phrase-target{font-size:25px;font-weight:800;line-height:1.5;margin-bottom:6px;}
  .phrase-sub{color:var(--text-muted);font-size:13.5px;margin-bottom:3px;}
  .phrase-translit{color:var(--amber);font-size:13.5px;margin-bottom:14px;}
  .mic-btn{display:flex;align-items:center;gap:8px;background:var(--coral-dim);border:1px solid var(--coral);color:var(--coral);
    padding:11px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .mic-btn.listening{background:var(--coral);color:#2a0d08;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,96,74,.45);}50%{box-shadow:0 0 0 10px rgba(226,96,74,0);}}
  .transcript-box{background:var(--bg-elev-2);border:1px dashed var(--border);border-radius:10px;padding:12px;margin:12px 0;font-size:14px;}
  .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;margin-bottom:8px;}
  .badge.g{background:var(--teal-dim);color:var(--teal);} .badge.n{background:var(--coral-dim);color:var(--coral);}
  .err-item{border-right:3px solid var(--coral);background:var(--bg-elev-2);border-radius:8px;padding:10px 13px;margin-bottom:8px;font-size:13px;}
  .err-item b{color:var(--coral);}
  .drill-card{background:var(--violet-dim);border:1px solid var(--violet);border-radius:10px;padding:12px 14px;margin-top:10px;}
  .drill-word{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px;}
  .progress-mini{display:flex;gap:5px;margin-bottom:14px;}
  .pdot{width:20px;height:5px;border-radius:3px;background:var(--bg-elev-2);}
  .pdot.done{background:var(--teal);} .pdot.active{background:var(--amber);}

  /* Chat */
  .chat-box{max-height:420px;overflow-y:auto;margin-bottom:12px;padding-left:2px;}
  .chat-msg{margin-bottom:10px;max-width:85%;padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.6;}
  .chat-msg.ai{background:var(--bg-elev-2);border:1px solid var(--border);}
  .chat-msg.user{background:var(--amber-dim);border:1px solid var(--amber);margin-right:auto;margin-left:0;}
  .report-item{background:var(--bg-elev-2);border-radius:10px;padding:12px;margin-bottom:8px;}

  .stars{display:flex;gap:6px;font-size:24px;margin:8px 0;}
  .stars span{cursor:pointer;opacity:.35;}
  .stars span.on{opacity:1;}

  footer{text-align:center;color:var(--text-muted);font-size:11.5px;margin-top:26px;line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brandBtn">
      <div class="brand-mark">ن</div>
      <div><h1>نُطق</h1><p>رحلتك المنطوقة من A1 إلى C2</p></div>
    </div>
    <div class="navbtns">
      <button class="navbtn" id="navArchive">📅 الأرشيف</button>
      <button class="navbtn" id="navHome">🏠 الرئيسية</button>
    </div>
  </header>
  <div id="app"></div>
  <footer>يعمل الاستماع والتسجيل الصوتي عبر Chrome أو Edge على سطح المكتب، ويحتاج إذن الميكروفون.</footer>
</div>

<script>
// ================= DATA =================
const LANGS = [
  {code:'ar',name:'العربية',locale:'ar-SA',dir:'rtl'},{code:'en',name:'الإنجليزية',locale:'en-US',dir:'ltr'},
  {code:'fr',name:'الفرنسية',locale:'fr-FR',dir:'ltr'},{code:'es',name:'الإسبانية',locale:'es-ES',dir:'ltr'},
  {code:'de',name:'الألمانية',locale:'de-DE',dir:'ltr'},{code:'it',name:'الإيطالية',locale:'it-IT',dir:'ltr'},
  {code:'pt',name:'البرتغالية',locale:'pt-BR',dir:'ltr'},{code:'ru',name:'الروسية',locale:'ru-RU',dir:'ltr'},
  {code:'ja',name:'اليابانية',locale:'ja-JP',dir:'ltr'},{code:'ko',name:'الكورية',locale:'ko-KR',dir:'ltr'},
  {code:'zh',name:'الصينية',locale:'zh-CN',dir:'ltr'},{code:'tr',name:'التركية',locale:'tr-TR',dir:'ltr'},
  {code:'nl',name:'الهولندية',locale:'nl-NL',dir:'ltr'},{code:'sv',name:'السويدية',locale:'sv-SE',dir:'ltr'},
  {code:'pl',name:'البولندية',locale:'pl-PL',dir:'ltr'},{code:'hi',name:'الهندية',locale:'hi-IN',dir:'ltr'},
  {code:'id',name:'الإندونيسية',locale:'id-ID',dir:'ltr'},{code:'th',name:'التايلاندية',locale:'th-TH',dir:'ltr'},
  {code:'vi',name:'الفيتنامية',locale:'vi-VN',dir:'ltr'},{code:'el',name:'اليونانية',locale:'el-GR',dir:'ltr'},
  {code:'he',name:'العبرية',locale:'he-IL',dir:'rtl'},{code:'fa',name:'الفارسية',locale:'fa-IR',dir:'rtl'},
  {code:'ur',name:'الأردية',locale:'ur-PK',dir:'rtl'},{code:'sw',name:'السواحيلية',locale:'sw-KE',dir:'ltr'},
  {code:'uk',name:'الأوكرانية',locale:'uk-UA',dir:'ltr'},{code:'ro',name:'الرومانية',locale:'ro-RO',dir:'ltr'},
];
const GEM_COLORS = ['#B5233E','#D4AF37','#C9CFD6','#1F6FB2','#2E8B57','#8E44AD','#178F8B','#B76E3F','#5D4E8C','#A63A50','#3E7CB1','#7A9E3F','#C77B3E','#4E6E81'];
LANGS.forEach((l,i)=> l.gem = GEM_COLORS[i % GEM_COLORS.length]);

const TOPICS = [
  {name:'تحيات وتعارف'},{name:'طلب الطعام والقهوة'},{name:'التسوق'},
  {name:'ركوب المواصلات'},{name:'في المطار'},{name:'حجز فندق'},
  {name:'السؤال عن الاتجاهات'},{name:'أول يوم عمل'},{name:'عند الطبيب'},
  {name:'حالة طارئة'},{name:'لقاء صديق جديد'},{name:'في المنزل'},
  {name:'الطقس وحديث عابر'},{name:'التخطيط لرحلة'},
];
const LEVELS = ['A1','A2','B1','B2','C1','C2'];

// ---- Professional jewel / shell iconography (no emoji) ----
let _iconSeq = 0;
function gemSVG(hex, size){
  size = size||26; const id = 'gem'+(_iconSeq++);
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" class="gem-icon">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="38%" stop-color="${hex}"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".38"/>
    </linearGradient></defs>
    <polygon points="50,4 92,34 76,96 24,96 8,34" fill="url(#${id})" stroke="#D4AF37" stroke-width="3"/>
    <polygon points="50,4 92,34 50,42 8,34" fill="#ffffff" opacity=".22"/>
  </svg>`;
}
function shellSVG(size){
  size = size||26; const id = 'shell'+(_iconSeq++);
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" class="shell-icon">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6DE"/><stop offset="60%" stop-color="#E8C77E"/><stop offset="100%" stop-color="#B8892E"/>
    </linearGradient></defs>
    <path d="M50 94 C22 94,6 62,6 40 C6 16,26 6,50 6 C74 6,94 16,94 40 C94 62,78 94,50 94 Z" fill="url(#${id})" stroke="#7a5a1f" stroke-width="1.5"/>
    <g stroke="#7a5a1f" stroke-width="1.6" fill="none" opacity=".55">
      <path d="M50 94 L50 10"/><path d="M50 94 L27 18"/><path d="M50 94 L73 18"/>
      <path d="M50 94 L14 38"/><path d="M50 94 L86 38"/>
    </g>
  </svg>`;
}

// ================= STATE =================
let app = { screen:'hero', lang:null, progress:null, placement:{queue:[],idx:0,attempts:[]},
  lesson:null, exIdx:0, errorTally:{}, chat:{history:[],topics:[]}, micPrimed:false };
let recognition=null, waveInterval=null;

const $ = id => document.getElementById(id);
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ================= CLAUDE API =================
async function callClaudeJSON(system,user){
  const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1400,system,messages:[{role:'user',content:user}]})});
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.text||'').join('\n');
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}
async function callClaudeText(system,messages){
  const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,system,messages})});
  const data = await res.json();
  return (data.content||[]).map(b=>b.text||'').join('\n').trim();
}

// ================= TTS =================
function speak(text,locale){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang=locale; u.rate=0.9;
  const voices = window.speechSynthesis.getVoices();
  const m = voices.find(v=>v.lang===locale) || voices.find(v=>v.lang && v.lang.startsWith(locale.split('-')[0]));
  if(m) u.voice=m;
  window.speechSynthesis.speak(u);
}

// ================= STORAGE HELPERS =================
async function getJSON(key){ try{ const r=await window.storage.get(key,false); return r&&r.value? JSON.parse(r.value):null; }catch(e){ return null; } }
async function setJSON(key,val){ try{ await window.storage.set(key,JSON.stringify(val),false); }catch(e){ console.error(e); } }

async function loadProgress(langCode){
  return (await getJSON('progress:'+langCode)) || {level:null,week:0,lessonInWeek:0,history:[]};
}
async function saveProgress(){ await setJSON('progress:'+app.lang.code, app.progress); }

// ================= NAV =================
$('brandBtn').onclick = ()=> renderHero();
$('navHome').onclick = ()=> renderHero();
$('navArchive').onclick = ()=> renderArchive();

// ================= SCREEN: HERO =================
const HERO_GREETING = 'أهلًا بك في عالم التحوّل، من الجمود إلى الوصول.';
function speakGreeting(){
  if(!('speechSynthesis' in window)) return;
  const doSpeak = ()=>{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(HERO_GREETING); u.lang='ar-SA'; u.rate=0.95;
    const voices = window.speechSynthesis.getVoices();
    const m = voices.find(v=>v.lang && v.lang.startsWith('ar'));
    if(m) u.voice=m;
    window.speechSynthesis.speak(u);
  };
  if(window.speechSynthesis.getVoices().length===0){
    window.speechSynthesis.onvoiceschanged = doSpeak;
  } else doSpeak();
}
function renderHero(){
  app.screen='hero';
  const scatter = [
    {t:'shell', pos:'right:4%; top:2px;', rot:-10, s:30},
    {t:'gem', c:'#B5233E', pos:'right:20%; top:36px;', rot:12, s:24},
    {t:'shell', pos:'right:38%; top:6px;', rot:8, s:26},
    {t:'gem', c:'#178F8B', pos:'right:55%; top:40px;', rot:-14, s:22},
    {t:'shell', pos:'right:72%; top:0px;', rot:14, s:28},
    {t:'gem', c:'#D4AF37', pos:'right:88%; top:38px;', rot:-8, s:24},
  ];
  $('app').innerHTML = `
    <div class="card journey">
      <div class="scatter">
        ${scatter.map(s=>`<div class="sc-item" style="${s.pos} transform:rotate(${s.rot}deg);">${s.t==='shell'?shellSVG(s.s):gemSVG(s.c,s.s)}</div>`).join('')}
      </div>
      <div class="journey-line">
        ${LEVELS.map(l=>`<div class="lvl-node">${l}</div>`).join('')}
      </div>
      <p style="text-align:center;font-size:14px;line-height:1.8;">
        تعلّم النطق الصحيح لأي لغة عبر <b>قصص مترابطة</b> تعيشها خطوة بخطوة —
        تستمع، تقلّد، تنطق بحريّة، ويصحح لك <b style="color:var(--amber)">فارس</b> و<b style="color:var(--violet)">لمى</b> أخطاءك بروح خفيفة،
        حتى تصل من <b>A1</b> إلى <b>C2</b>.
      </p>
      <button class="greet-btn" id="greetBtn">🔊 استمع للترحيب</button>
      <button class="btn btn-primary btn-block" id="startBtn" style="margin-top:14px;">ابدأ رحلتك الآن</button>
    </div>
  `;
  $('startBtn').onclick = renderLangPicker;
  $('greetBtn').onclick = speakGreeting;
  speakGreeting();
}

// ================= SCREEN: LANG PICKER =================
function renderLangPicker(){
  app.screen='langs';
  $('app').innerHTML = `
    <div class="card">
      <h2 style="font-size:15px;margin-top:0;">اختر اللغة التي تريد تعلّمها</h2>
      <div class="lang-grid">${LANGS.map((l,i)=>`
        <div class="lang-chip" data-i="${i}"><span class="ic">${gemSVG(l.gem,32)}</span>${l.name}</div>`).join('')}</div>
    </div>`;
  document.querySelectorAll('.lang-chip').forEach(el=>{
    el.onclick = ()=>{
      app.lang = LANGS[+el.dataset.i];
      showMicModal(async ()=>{
        const placement = await getJSON('placement:'+app.lang.code);
        if(!placement){ startPlacementTest(); }
        else { app.progress = await loadProgress(app.lang.code); if(!app.progress.level) app.progress.level = placement.level; renderDashboard(); }
      });
    };
  });
}

// Real permission modal (native confirm()/alert() are blocked inside sandboxed frames,
// so we use our own DOM modal and request getUserMedia directly from the button's click handler).
function showMicModal(onDone){
  if(app.micPrimed){ onDone(); return; }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="card" style="max-width:400px;text-align:center;">
    <div style="display:flex;justify-content:center;margin-bottom:10px;">${shellSVG(46)}</div>

// ================= SPEECH RECOGNITION HELPER =================
function recognizeOnce(locale, onResult, targetDivId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ $(targetDivId).innerHTML = `<p class="muted">التعرف الصوتي غير مدعوم في هذا المتصفح. جرّب Chrome أو Edge.</p>`; return; }
  recognition = new SR(); recognition.lang = locale; recognition.interimResults=false; recognition.maxAlternatives=1;
  recognition.onresult = (e)=> onResult(e.results[0][0].transcript);
  recognition.onerror = ()=> { $(targetDivId).innerHTML = `<p class="muted">تعذّر الوصول للميكروفون، تأكد من الإذن وحاول مجددًا.</p>`; };
  recognition.start();
}

أنشئ بالضبط 6 عناصر في exchanges، بحيث تشكّل مشهدًا واحدًا مترابطًا (قصة قصيرة متصلة وليست جملًا منفصلة)، تتصاعد بشكل طبيعي وتنتهي بلحظة إنجاز واضحة.`;

async function analyzeExchange(ex, transcript){
  $('feedbackArea').innerHTML = `<div class="loading"><div class="spinner"></div> فارس ولمى يستمعان لك...</div>`;
  try{
    const system = `أنتما شخصيتان كرتونيتان أصليتان لتطبيق تعلّم لغات عربي: "فارس" (شاب حماسي خفيف الظل) و"لمى" (فتاة ذكية ودافئة). تتبادلان تعليقًا قصيرًا بلهجة عربية دارجة (اختر بنفسك مزيجًا من مصرية/خليجية/شامية بشكل متنوع في كل مرة) بروح دعابة أو تشجيع حسب الأداء — رد متجدد دائمًا وليس مكررًا. إلى جانب ذلك حلّل الفرق بين الجملة الهدف وما التقطه نظام التعرف الصوتي (الذي يكتب كلمات تشبه صوتيًا ما نُطق فعليًا) لتحديد أخطاء النطق المحتملة. أعد فقط JSON بالشكل بالضبط:
{"accuracy":"ممتاز|جيد|يحتاج تحسين","banter":[{"speaker":"فارس","line":"..."},{"speaker":"لمى","line":"..."}],"errors":[{"word_expected":"...","heard_as":"...","tip":"نصيحة تصحيح قصيرة بالعربية"}]}
اجعل errors فارغة إذا كان النطق مطابقًا أو شبه مطابق.`;
    const user = `اللغة: ${app.lang.name}\nالجملة الهدف: "${ex.learner_target}"\nما سمعه النظام: "${transcript}"`;
    const fb = await callClaudeJSON(system,user);
    (fb.errors||[]).forEach(er=>{ app.errorTally[er.word_expected] = (app.errorTally[er.word_expected]||0)+1; });
    renderFeedback(ex, fb);
    logAttempt(ex, transcript, fb);
  }catch(e){ $('feedbackArea').innerHTML = `<p class="muted">تعذّر تحليل النطق، حاول مجددًا.</p>`; }
}

function renderFeedback(ex, fb){
  const cls = fb.accuracy==='ممتاز'||fb.accuracy==='جيد' ? 'g':'n';
  let html = `<div class="badge ${cls}">${escapeHtml(fb.accuracy)}</div>`;
  (fb.banter||[]).forEach(b=>{
    const isFares = b.speaker==='فارس';
    html += `<div class="persona ${isFares?'':'right'}">
      <div class="avatar ${isFares?'fares':'lama'}">${isFares?'ف':'ل'}</div>
      <div class="bubble">${escapeHtml(b.line)}</div></div>`;
  });
  (fb.errors||[]).forEach(er=> html += `<div class="err-item"><b>${escapeHtml(er.word_expected)}</b> ← سُمعت: ${escapeHtml(er.heard_as)}<br>💡 ${escapeHtml(er.tip)}</div>`);
  $('feedbackArea').innerHTML = html;
  speak(ex.learner_target, app.lang.locale);

  // repeated-error minimal pair drill
  const repeated = Object.keys(app.errorTally).find(w=>app.errorTally[w]>=2);
  if(repeated) renderMinimalPairDrill(repeated);

  const isLast = app.exIdx === app.lesson.exchanges.length-1;
  $('navArea').innerHTML = `<div class="row" style="margin-top:14px;">
    <button class="btn btn-secondary" id="retryBtn">إعادة المحاولة</button>
    <button class="btn btn-teal" id="nextBtn">${isLast?'إنهاء الدرس 🎉':'التالي ←'}</button></div>`;
  $('retryBtn').onclick = ()=>{ $('transcriptArea').innerHTML=''; $('feedbackArea').innerHTML=''; $('navArea').innerHTML=''; };
  $('nextBtn').onclick = ()=>{ if(isLast) finishLesson(); else { app.exIdx++; renderExchange(); } };
}

async function renderMinimalPairDrill(word){
  const holder = document.createElement('div'); holder.className='drill-card'; holder.innerHTML = `<div class="loading"><div class="spinner"></div> تحضير تمرين تصحيح مركّز...</div>`;
  $('feedbackArea').appendChild(holder);
  try{
    const system = `أنت خبير نطق. أعد فقط JSON: {"sound_note":"جملة قصيرة بالعربية تشرح الصوت الصعب","pairs":[{"word":"...","meaning":"..."},{"word":"...","meaning":"..."}]}. أنشئ زوجًا تمييزيًا (Minimal Pair) بسيطًا يركّز على نفس الصوت الموجود في الكلمة المعطاة.`;
    const user = `اللغة: ${app.lang.name}\nالكلمة التي يخطئ المتعلم في نطقها: "${word}"`;
    const d = await callClaudeJSON(system,user);
    holder.innerHTML = `<b style="color:var(--violet);">🎯 تمرين تصحيح مركّز</b><p style="font-size:13px;margin:6px 0;">${escapeHtml(d.sound_note)}</p>
      ${d.pairs.map(p=>`<div class="drill-word"><span dir="${app.lang.dir}">${escapeHtml(p.word)} <span class="muted">(${escapeHtml(p.meaning)})</span></span>
        <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px;" onclick="speak('${p.word.replace(/'/g,"\\'")}','${app.lang.locale}')">🔊</button></div>`).join('')}`;
    app.errorTally[word] = 0;
  }catch(e){ holder.remove(); }
}

async function logAttempt(ex, transcript, fb){
  app.lesson._attempts = app.lesson._attempts || [];
  app.lesson._attempts.push({target:ex.learner_target, transcript, accuracy:fb.accuracy});
}

async function finishLesson(){

  const goodCount = attempts.filter(a=>a.accuracy==='ممتاز'||a.accuracy==='جيد').length;
  $('app').innerHTML = `<div class="card"><div class="loading"><div class="spinner"></div> جارٍ تقييم الدرس...</div></div>`;
  let summary = 'أحسنت! أنهيت المشهد بنجاح.';
  try{
    summary = await callClaudeText(
      `أنت فارس ولمى معًا، شخصيتان بشوش بلهجة عربية دارجة متنوعة. اكتب سطرين احتفاليين قصيرين (سطر لكل شخصية) بمناسبة إنهاء المتعلم لمشهد تعلّم كامل بنجاح، بروح دافئة وممتعة، بدون علامات JSON أو تنسيق، نص عادي فقط.`,
      [{role:'user',content:`أنهى المتعلم مشهد "${app.lesson.title}" بلغة ${app.lang.name}. عدد الجمل التي نطقها بشكل جيد أو ممتاز: ${goodCount} من ${attempts.length}.`}]
    );
  }catch(e){}
  $('app').innerHTML = `
    <div class="card">
      <h2 style="font-size:16px;">🎉 أتممت: ${escapeHtml(app.lesson.title)}</h2>
      <p style="white-space:pre-line;font-size:14px;line-height:1.8;">${escapeHtml(summary)}</p>
      <p class="muted" style="font-size:13px;">أداء دقيق في ${goodCount} من ${attempts.length} جمل.</p>
      <p style="font-size:13.5px;margin-top:14px;">قيّم هذا الدرس بنفسك:</p>
      <div class="stars" id="starsRow">${[1,2,3,4,5].map(n=>`<span data-n="${n}">★</span>`).join('')}</div>
      <button class="btn btn-primary btn-block" id="saveLessonBtn" disabled>احفظ وتابع</button>
    </div>`;
  let rating=0;
  document.querySelectorAll('#starsRow span').forEach(s=>{
    s.onclick = ()=>{ rating=+s.dataset.n; document.querySelectorAll('#starsRow span').forEach(x=>x.classList.toggle('on', +x.dataset.n<=rating)); $('saveLessonBtn').disabled=false; };
  });
  $('saveLessonBtn').onclick = async ()=>{
    app.progress.lessonInWeek++;
    app.progress.history.push({date:new Date().toISOString(), level:app.progress.level, week:app.progress.week,
      title:app.lesson.title, topic:app.lesson.topic.name, goodCount, total:attempts.length, userRating:rating});
    await saveProgress();
    renderDashboard();
  };
}

// ================= SCREEN: WEEKLY CHAT =================
function startWeeklyChat(topics){
  app.screen='chat';
  app.chat = {history:[], topics};
  $('app').innerHTML = `
    <div class="card">
      <h2 style="font-size:15px;margin-top:0;">🗣️ محادثة حرة نهاية الأسبوع</h2>
      <p class="muted" style="font-size:13px;">تحدّث بحرّية بلغة ${app.lang.name}، استخدم كل ما تعلمته هذا الأسبوع. اضغط "إنهاء" عندما تنتهي.</p>
      <div class="chat-box" id="chatBox"></div>
      <div class="row">
        <button class="mic-btn" id="chatMic">🎤 تحدث</button>
        <input type="text" id="chatText" placeholder="أو اكتب هنا..." style="flex:1;">
        <button class="btn btn-secondary" id="chatSend">إرسال</button>
      </div>
      <button class="btn btn-teal btn-block" id="endChatBtn" style="margin-top:12px;">إنهاء المحادثة وعرض التقرير</button>
    </div>`;
  addChatMsg('ai', `مرحبًا! جاهز نتكلم شوي بـ${app.lang.name}؟ ابدأ أنت.`);
  $('chatMic').onclick = ()=>{
    $('chatMic').classList.add('listening');
    recognizeOnce(app.lang.locale, (t)=>{ $('chatMic').classList.remove('listening'); sendChat(t); }, 'chatBox');
  };
  $('chatSend').onclick = ()=>{ const v=$('chatText').value.trim(); if(v){ $('chatText').value=''; sendChat(v); } };
  $('endChatBtn').onclick = finishWeeklyChat;
}
function addChatMsg(role,text){
  app.chat.history.push({role, text});
  const box=$('chatBox');
  box.innerHTML += `<div class="chat-msg ${role}" dir="${role==='user'?app.lang.dir:'rtl'}">${escapeHtml(text)}</div>`;
  box.scrollTop = box.scrollHeight;
}
async function sendChat(userText){
  addChatMsg('user', userText);
  const box=$('chatBox'); box.innerHTML += `<div class="loading" id="chatLoading"><div class="spinner"></div></div>`;
  try{
    const system = `أنت متحدث أصلي ودود بلغة ${app.lang.name}، تجري محادثة حرة قصيرة وبسيطة مع متعلم في مستوى ${app.progress.level}. رد بجملة أو جملتين بلغة ${app.lang.name} فقط (بدون ترجمة)، وابقِ الحوار مستمرًا بطرح سؤال بسيط في النهاية.`;
    const msgs = app.chat.history.map(h=>({role: h.role==='user'?'user':'assistant', content:h.text}));
    const reply = await callClaudeText(system, msgs);
    $('chatLoading').remove();
    addChatMsg('ai', reply);
  }catch(e){ $('chatLoading').remove(); }
}
async function finishWeeklyChat(){
  $('app').innerHTML = `<div class="card"><div class="loading"><div class="spinner"></div> جارٍ إعداد تقرير الأسبوع...</div></div>`;
  try{
    const system = `أنتما فارس ولمى، مدرّبا لغة. بناءً على نص محادثة حرة بلغة ${app.lang.name} مع متعلم عربي مستواه ${app.progress.level}، حول مواضيع الأسبوع التالية: ${app.chat.topics.join('، ')}. قيّما أداءه. أعد فقط JSON:
{"mastered":["نقطة أتقنها 1","نقطة 2"],"gaps":[{"topic":"اسم الموضوع من القائمة المعطاة بالضبط","issue":"وصف قصير للمشكلة بالعربية"}],"overall":"جملة ختامية تحفيزية بالعربية"}`;
    const user = JSON.stringify(app.chat.history);
    const report = await callClaudeJSON(system,user);
    await setJSON('weekly:'+app.lang.code+':'+app.progress.week, {date:new Date().toISOString(), report, topics:app.chat.topics});
    renderWeekReport(report);
  }catch(e){ $('app').innerHTML = `<div class="card">تعذّر إعداد التقرير. <button class="btn btn-secondary" onclick="renderDashboard()">عودة</button></div>`; }
}
function renderWeekReport(report){
  $('app').innerHTML = `
    <div class="card">
      <h2 style="font-size:16px;margin-top:0;">📊 تقرير الأسبوع ${app.progress.week+1}</h2>
      <p style="font-size:14px;">${escapeHtml(report.overall)}</p>
      <h3 style="font-size:13px;color:var(--teal);">ما أتقنته:</h3>
      ${(report.mastered||[]).map(m=>`<div class="report-item">✅ ${escapeHtml(m)}</div>`).join('')}
      <h3 style="font-size:13px;color:var(--coral);">نقاط تحتاج مراجعة:</h3>
      ${(report.gaps||[]).map(g=>`<div class="report-item">⚠️ <b>${escapeHtml(g.topic)}</b>: ${escapeHtml(g.issue)}
        <button class="btn btn-secondary" style="margin-top:8px;padding:6px 12px;font-size:12px;" onclick='startLesson(${JSON.stringify(TOPICS.find(t=>t.name===g.topic)||TOPICS[0])})'>درّب على هذا الموضوع</button></div>`).join('')}
      <button class="btn btn-primary btn-block" id="nextWeekBtn" style="margin-top:14px;">
        ${LEVELS.indexOf(app.progress.level) < LEVELS.length-1 && app.progress.week>0 && (app.progress.week+1)%4===0 ? 'انتقل للمستوى التالي' : 'ابدأ الأسبوع القادم'}
      </button>
    </div>`;
  $('nextWeekBtn').onclick = async ()=>{
    app.progress.week++; app.progress.lessonInWeek=0;
    if((app.progress.week)%4===0 && LEVELS.indexOf(app.progress.level)<LEVELS.length-1){
      app.progress.level = LEVELS[LEVELS.indexOf(app.progress.level)+1];
    }
    await saveProgress(); renderDashboard();
  };
}

// ================= SCREEN: ARCHIVE =================
async function renderArchive(){
  app.screen='archive';
  $('app').innerHTML = `<div class="card"><div class="loading"><div class="spinner"></div> تحميل الأرشيف...</div></div>`;
  let html = `<div class="card"><h2 style="font-size:15px;margin-top:0;">📅 سجل التقدم</h2>`;
  let any=false;
  for(const l of LANGS){
    const prog = await getJSON('progress:'+l.code);
    if(!prog || !prog.history || !prog.history.length){ continue; }
    any=true;
    html += `<h3 style="font-size:14px;margin:14px 0 6px;display:flex;align-items:center;gap:8px;">${gemSVG(l.gem,20)} ${l.name} — المستوى ${prog.level}</h3>`;
    prog.history.slice().reverse().forEach(h=>{
      html += `<div class="report-item"><b>${escapeHtml(h.title)}</b> <span class="muted">(${escapeHtml(h.topic)})</span><br>
        <span class="muted" style="font-size:12px;">${h.date.slice(0,10)} · دقة ${h.goodCount}/${h.total} · تقييمك: ${'★'.repeat(h.userRating||0)}${'☆'.repeat(5-(h.userRating||0))}</span></div>`;
    });
  }
  html += any? '' : `<p class="muted">لا يوجد نشاط محفوظ بعد. ابدأ درسك الأول من الرئيسية.</p>`;
  html += `</div>`;
  $('app').innerHTML = html;
}

renderHero();

  window.addEventListener('load', ()=> navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
